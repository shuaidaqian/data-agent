name: Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 ruff==0.16.0
      - name: Ruff
        run: ruff check main.py sql_agent tests
      - name: Black
        run: black --check --diff main.py sql_agent tests

