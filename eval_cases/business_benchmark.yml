name: business_semantic_benchmark
description: 覆盖销售、客户、商品、退款、组织和访问行为的业务 NL-to-SQL benchmark。
cases:
  - id: biz_001_total_paid_orders
    question: 已支付订单一共有多少笔？
    difficulty: simple
    tags: [basic, semantic]
    expected_columns: [paid_orders]
    expected_sql_contains: [COUNT, orders, paid]
    golden_sql: |
      SELECT COUNT(*) AS paid_orders
      FROM orders
      WHERE status = 'paid';
  - id: biz_002_total_gmv
    question: 统计所有有效订单的 GMV。
    difficulty: simple
    tags: [basic, semantic]
    expected_columns: [gmv]
    expected_sql_contains: [SUM, order_items, orders]
    golden_sql: |
      SELECT SUM(oi.quantity * oi.unit_price) AS gmv
      FROM order_items oi
      JOIN orders o ON oi.order_id = o.id
      WHERE o.status IN ('paid', 'refunded');
  - id: biz_003_monthly_gmv
    question: 按月查看有效订单 GMV 趋势。
    difficulty: medium
    tags: [semantic, trend, visualization]
    expected_columns: [order_month, gmv]
    expected_visualization_type: line
    golden_sql: |
      SELECT strftime('%Y-%m', o.order_date) AS order_month,
             SUM(oi.quantity * oi.unit_price) AS gmv
      FROM orders o
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status IN ('paid', 'refunded')
      GROUP BY strftime('%Y-%m', o.order_date)
      ORDER BY order_month;
  - id: biz_004_region_gmv
    question: 各客户区域贡献了多少 GMV？
    difficulty: medium
    tags: [semantic, join, visualization]
    expected_columns: [region, gmv]
    expected_visualization_type: bar
    golden_sql: |
      SELECT c.region,
             SUM(oi.quantity * oi.unit_price) AS gmv
      FROM orders o
      JOIN customers c ON o.customer_id = c.id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status IN ('paid', 'refunded')
      GROUP BY c.region
      ORDER BY gmv DESC;
  - id: biz_005_top_products_by_revenue
    question: 收入最高的前三个产品是什么？
    difficulty: medium
    tags: [join, analysis, visualization]
    expected_columns: [product_name, revenue]
    expected_visualization_type: bar
    golden_sql: |
      SELECT p.name AS product_name,
             SUM(oi.quantity * oi.unit_price) AS revenue
      FROM order_items oi
      JOIN products p ON oi.product_id = p.id
      JOIN orders o ON oi.order_id = o.id
      WHERE o.status = 'paid'
      GROUP BY p.name
      ORDER BY revenue DESC
      LIMIT 3;
  - id: biz_006_refund_rate_by_channel
    question: 按订单渠道计算退款订单占比。
    difficulty: hard
    tags: [join, analysis]
    expected_columns: [channel, refund_order_rate]
    golden_sql: |
      SELECT o.channel,
             ROUND(1.0 * COUNT(DISTINCT r.order_id) / COUNT(DISTINCT o.id), 4) AS refund_order_rate
      FROM orders o
      LEFT JOIN refunds r ON o.id = r.order_id
      WHERE o.status IN ('paid', 'refunded')
      GROUP BY o.channel
      ORDER BY refund_order_rate DESC;
  - id: biz_007_salesperson_gmv
    question: 每个销售或客户成功人员带来的有效 GMV 是多少？
    difficulty: medium
    tags: [join, analysis]
    expected_columns: [employee_name, gmv]
    golden_sql: |
      SELECT e.name AS employee_name,
             SUM(oi.quantity * oi.unit_price) AS gmv
      FROM orders o
      JOIN employees e ON o.employee_id = e.id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status IN ('paid', 'refunded')
      GROUP BY e.name
      ORDER BY gmv DESC;
  - id: biz_008_customer_segment_net_revenue
    question: 按客户分层统计净收入。
    difficulty: medium
    tags: [semantic, join]
    expected_columns: [segment, net_revenue]
    golden_sql: |
      SELECT c.segment,
             SUM(oi.quantity * oi.unit_price) - SUM(o.discount_amount) AS net_revenue
      FROM orders o
      JOIN customers c ON o.customer_id = c.id
      JOIN order_items oi ON o.id = oi.order_id
      WHERE o.status = 'paid'
      GROUP BY c.segment
      ORDER BY net_revenue DESC;
  - id: biz_009_category_margin
    question: 各产品类别的毛利是多少？
    difficulty: hard
    tags: [semantic, join, analysis]
    expected_columns: [category, gross_margin]
    golden_sql: |
      SELECT p.category,
             SUM(oi.quantity * (oi.unit_price - p.cost)) AS gross_margin
      FROM order_items oi
      JOIN products p ON oi.product_id = p.id
      JOIN orders o ON oi.order_id = o.id
      WHERE o.status = 'paid'
      GROUP BY p.category
      ORDER BY gross_margin DESC;
  - id: biz_010_web_demo_to_order_customers
    question: 有多少提交 demo 的客户最终产生了有效订单？
    difficulty: hard
    tags: [join, analysis]
    expected_columns: [converted_customers]
    golden_sql: |
      SELECT COUNT(DISTINCT o.customer_id) AS converted_customers
      FROM web_events w
      JOIN orders o ON w.customer_id = o.customer_id
      WHERE w.event_type = 'demo_request'
        AND o.status IN ('paid', 'refunded');
